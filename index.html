<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Healthy Eating Mission | Educational Platformer</title>
    <link rel="icon" href="./assets/images/hero.png">
    <!-- The Playables SDK must load before Phaser and all game code. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <script src="./vendor/phaser.min.js"></script>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --accent: #FFC107;
            --bg: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e3c72 0%, #1a1a2e 100%);
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.16);
            background: #000;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        /* Loading Screen Style */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--glass);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .yt-game-paused .loader {
            animation-play-state: paused;
        }

        h1 {
            margin-top: 20px;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
        }

        #loading-status {
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.76);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div id="game-container" role="application" aria-label="Healthy Eating Mission game">
        <div id="loading-screen">
            <div class="loader"></div>
            <h1>Healthy Eating Mission</h1>
            <div id="loading-status" aria-live="polite">Preparing the adventure…</div>
        </div>
    </div>

    <!-- Game Logic -->
    <script type="module" src="./main.js"></script>
</body>
</html>
